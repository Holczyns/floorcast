[project]
name = "floorcast"
version = "0.1.0"
description = "Floor plan of the home with live states for Home Assistant"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Home Assistant entities declare their attributes as class-level lists;
# explicit if/else reads better than a ternary for control flow.
ignore = ["RUF012", "SIM108"]
